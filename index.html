<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل المسابقات الطلابية المعتمدة 1448هـ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F2;--surface:#FFFFFF;--surface2:#F6F9F8;--ink:#13302E;--muted:#5A6F6C;--line:#D3DEDB;
  --brand:#0C6A64;--brand-ink:#FFFFFF;--open:#17804A;--soon:#9C6200;--ended:#8C9896;
  --c-sport:#2F7D34;--c-sci:#1D5EA6;--c-cit:#0C6A64;--c-scout:#6E6A1A;--c-cult:#8B3A6F;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1918;--surface:#152322;--surface2:#1A2B2A;--ink:#E2ECEA;--muted:#9AB0AC;--line:#2A3D3B;
  --brand:#3AAFA5;--brand-ink:#06201E;--open:#4CC583;--soon:#E0A43A;--ended:#6E807D;
  --c-sport:#6CC072;--c-sci:#6AA6EE;--c-cit:#3AAFA5;--c-scout:#C5BE52;--c-cult:#D886BD;}}
:root[data-theme="dark"]{
  --paper:#0E1918;--surface:#152322;--surface2:#1A2B2A;--ink:#E2ECEA;--muted:#9AB0AC;--line:#2A3D3B;
  --brand:#3AAFA5;--brand-ink:#06201E;--open:#4CC583;--soon:#E0A43A;--ended:#6E807D;
  --c-sport:#6CC072;--c-sci:#6AA6EE;--c-cit:#3AAFA5;--c-scout:#C5BE52;--c-cult:#D886BD;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 80px}

/* head */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:12px 0 18px;border-bottom:2px solid var(--ink)}
.top h1{margin:0;font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:0}
.top p{margin:4px 0 0;color:var(--muted)}
.today{font-size:clamp(16px,2vw,19px);font-weight:500;max-width:46ch}
.today b{color:var(--open)}

/* tabs */
.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-inline-start:6px;border-radius:11px;background:var(--brand);color:var(--brand-ink);font-size:12px;text-align:center}

/* filters */
.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:10px}
.filters input,.filters select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 10px;color:var(--muted);font-size:14px}
.views{display:flex;gap:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* guide table */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.guide{width:100%;border-collapse:collapse;min-width:1080px}
.guide th{position:sticky;top:0;background:var(--surface2);text-align:start;font-size:13px;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.guide td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.guide tr.sel td{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.guide tr:last-child td{border-bottom:0}
.cname{font-weight:700;font-size:15px;line-height:1.45}
.cname small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.dom{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600;font-size:13px}
.dom i{width:4px;height:16px;border-radius:2px;display:inline-block}
.st{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:6px;margin-top:4px;border:1px solid currentColor}
.st.open{color:var(--open)}.st.soon{color:var(--soon)}.st.ended{color:var(--ended)}
.reg div{white-space:nowrap}.reg em{font-style:normal;color:var(--muted);font-size:12.5px}
.pick{width:20px;height:20px;accent-color:var(--brand);cursor:pointer}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);margin:3px 0 0 4px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

@media (max-width:820px){
  .filters{grid-template-columns:1fr 1fr}
  .filters .q{grid-column:1/-1}
  table.guide{min-width:0}
  .guide thead{display:none}
  .guide tr{display:grid;grid-template-columns:32px 1fr;gap:2px 10px;padding:12px;border-bottom:1px solid var(--line)}
  .guide td{border:0;padding:2px 0;grid-column:2}
  .guide td.c-pick{grid-column:1;grid-row:1 / span 3}
  .guide td[data-l]::before{content:attr(data-l)"： ";color:var(--muted);font-size:12.5px}
  .guide td.c-name::before{content:none}
}

/* timeline */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tl-in{min-width:880px;position:relative}
.tl-row{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-name{padding:8px 10px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.tl-name input{flex:none}
.tl-track{position:relative;min-height:36px;background-image:repeating-linear-gradient(to left,transparent 0,transparent calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px),var(--line) calc(100%/12))}
.tl-head .tl-track{display:grid;grid-template-columns:repeat(12,1fr);background:none}
.tl-head .tl-track span{font-size:12px;color:var(--muted);text-align:center;padding:8px 2px;border-inline-start:1px solid var(--line)}
.tl-bar{position:absolute;top:9px;height:18px;border-radius:4px;min-width:6px;opacity:.9}
.tl-bar.ended{opacity:.35}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--open);z-index:2;pointer-events:none}
.tl-now::after{content:"اليوم";position:absolute;top:2px;inset-inline-start:4px;font-size:11px;color:var(--open);font-weight:700;white-space:nowrap}

/* plan */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:17px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font-size:14.5px}
@media (max-width:820px){.form{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.hint{color:var(--muted);font-size:13.5px;margin:0}

.sheetbox{overflow-x:auto}
.sheet{background:#fff;color:#111;width:100%;min-width:980px;padding:22px 26px;border:1px solid var(--line);border-radius:4px;font-size:13px;line-height:1.5}
.sh-head{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px;background:#E4F3E8;border:1px solid #BFDFC9;border-radius:6px;padding:12px 18px;min-height:96px}
.sh-logo{justify-self:start;align-self:start;text-align:center;color:#0B5A3C;line-height:1.25}
.sh-logo img{max-height:70px;max-width:150px;display:block}
.sh-logo b{display:block;font-size:16px}.sh-logo span{font-size:9px}
.sh-org{text-align:center;font-weight:600;font-size:14.5px;line-height:1.8;color:#14352A}
.sh-org .school{font-size:16px;font-weight:700;color:#0B5A3C}
.sh-title{text-align:center;margin:16px 0 12px}
.sh-title h2{margin:0 0 4px;font-size:22px;color:#0B5A3C}
.sh-title p{margin:0;font-size:14.5px;color:#333;line-height:1.7}
table.plan{width:100%;border-collapse:collapse}
.plan th,.plan td{border:1px solid #9FB3B0;padding:6px 7px;text-align:center;vertical-align:middle}
.plan th{background:#E4F3E8;font-weight:700;font-size:12.5px}
.plan td.tn{text-align:right;font-weight:600}
.ed{min-width:60px;min-height:18px;display:block;outline:0;border-radius:3px}
.ed:empty::before{content:attr(data-ph);color:#A0A8A7}
.ed:focus{background:#FFF8E1}
.sh-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:26px;text-align:center}
.sh-sign div{line-height:2.2}
.sh-sign b{display:block}
.noplan{padding:30px;text-align:center;color:var(--muted)}

/* toast */
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.dpk{display:block;width:100%;min-width:88px;background:none;border:1px dashed #9FB3B0;border-radius:5px;padding:4px 3px;cursor:pointer;color:#111;font:inherit;line-height:1.35}
.dpk.empty{color:#8A9593}
.dpk small{display:block;font-size:11px;color:#4D6360}
.dpk.flat{border:0;padding:0}
.modal{position:fixed;inset:0;background:rgba(8,26,26,.5);z-index:15;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center}}
.mbox{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.mbox{border-radius:12px}}
.mhead{padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px}.mhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.mtabs{display:flex;gap:6px;margin-top:10px}
.mbody{overflow-y:auto;padding:10px 12px}
.wk{border:1px solid var(--line);border-radius:9px;margin-bottom:6px;overflow:hidden}
.wk>button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--surface2);border:0;padding:9px 12px;cursor:pointer;text-align:start}
.wk>button b{font-size:14.5px}.wk>button span{font-size:12.5px;color:var(--muted)}
.wk.cur>button{background:color-mix(in srgb,var(--brand) 14%,var(--surface2))}
.etag{font-size:11.5px;font-weight:600;color:var(--soon);border:1px solid currentColor;border-radius:5px;padding:0 6px;margin-inline-start:6px}
.days{display:grid;gap:4px;padding:8px}
.day{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;cursor:pointer;text-align:start}
.day:hover:not(:disabled){border-color:var(--brand)}
.day.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));font-weight:700}
.day:disabled{opacity:.55;cursor:not-allowed}
.day em{font-style:normal;font-size:12px;color:var(--muted)}
.brk{text-align:center;font-size:12.5px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px);border-radius:7px;padding:6px;margin:4px 0 10px}
.mfoot{display:flex;gap:8px;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line)}
.calpick{display:grid;gap:10px;padding:6px 2px}
.calpick button{text-align:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer}
.calpick b{display:block;font-size:15px}.calpick span{font-size:13px;color:var(--muted)}
.busy{position:fixed;inset:0;background:rgba(10,30,30,.45);display:flex;align-items:center;justify-content:center;z-index:20;color:#fff;font-weight:600;font-size:16px}
.shot{position:fixed;top:0;left:-20000px;background:#fff;direction:rtl}
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-end:14px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* execution card (mirrors the ministry PPTX template, A4 portrait) */
.cardsbox{overflow:hidden}
.card{width:210mm;height:297mm;background:#fff;color:#003845;margin:0 auto 18px;position:relative;padding:7.7mm 10.8mm 0 9.8mm;font-family:"IBM Plex Sans Arabic","Sakkal Majalla",Tahoma,sans-serif;box-shadow:0 2px 14px rgba(0,40,50,.16);overflow:hidden}
.cd-logo{position:absolute;top:7.7mm;left:8.8mm;width:30mm;text-align:center;line-height:1.25;color:#003845}
.cd-logo b{display:block;font-size:12pt}
.cd-logo span{font-size:7pt;letter-spacing:.2px}
.cd-title{margin:15.5mm 0 3mm;text-align:center;font-size:18pt;font-weight:700;color:#003744}
table.ct{width:100%;border-collapse:collapse;table-layout:fixed}
.ct td{border:1px solid #003845;padding:.6mm 1.6mm;text-align:center;vertical-align:middle;font-size:11pt;line-height:1.35}
.ct tr:nth-child(even) td{background:#D2E2E8}
.ct td.lb{font-weight:700;font-size:12pt}
.ct td.sm{font-size:10pt;text-align:right}
.ct td.sl{font-size:10.5pt}
.ce{display:block;min-height:1.3em;outline:0;border-radius:2px}
.ce.inl{display:inline-block;min-width:8mm}
.ce:focus{background:#FFF6CC}
.ce.auto{color:#0B5F55}
.dpc{cursor:pointer}
.dpc:hover{background:#FFF6CC!important}
.dpc .cv{color:#0B5F55}
.pickhint{color:#9AA7A5;font-size:9.5pt}
.sdp{background:none;border:0;border-bottom:1px dashed #8FB0AC;padding:0 2px;font:inherit;color:#0B5F55;cursor:pointer;min-width:30mm;text-align:start}
.cd-sign{display:flex;justify-content:space-between;margin:9mm 4mm 0;font-size:12pt;line-height:1.9}
.cd-sign div{min-width:62mm}
.cd-sign b{display:block;font-weight:700}
.cd-note{margin:7mm 0 0;padding-inline-start:5mm;font-size:10.5pt;line-height:1.6;position:relative}
