<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة بطاقة تنفيذ مسابقة نشاط طلابي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #525659;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        
        .print-container {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background: white;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        /* الصورة الأصلية كخلفية مطابقة تماماً للنموذج الرسمي */
        .form-background-image {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: fill;
            z-index: 1;
        }

        /* طبقة الحقول النصية فوق الصورة */
        .overlay-fields-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .editable-field {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #002b36;
            text-align: right;
            padding: 2px 4px;
            box-sizing: border-box;
        }

        .editable-field:focus {
            background: rgba(255, 255, 0, 0.25);
            box-shadow: 0 0 0 2px #0c6a64;
        }

        /* إحداثيات الحقول بدقة مطابقة للخانات الفارغة في النموذج */
        .f-school { top: 12.3%; left: 32%; width: 45%; }
        .f-competition { top: 17.5%; left: 32%; width: 45%; }
        .f-field { top: 22.5%; left: 32%; width: 45%; }
        .f-prep-classes { top: 27.2%; left: 32%; width: 45%; }
        .f-term { top: 32.2%; left: 32%; width: 45%; }
        
        /* بداية التنفيذ */
        .f-start-day { top: 37.0%; left: 63%; width: 10%; text-align: center; }
        .f-start-week { top: 37.0%; left: 41%; width: 10%; text-align: center; }
        .f-start-date { top: 37.0%; left: 13%; width: 18%; text-align: center; }

        /* نهاية التنفيذ */
        .f-end-day { top: 41.8%; left: 63%; width: 10%; text-align: center; }
        .f-end-week { top: 41.8%; left: 41%; width: 10%; text-align: center; }
        .f-end-date { top: 41.8%; left: 13%; width: 18%; text-align: center; }

        .f-class { top: 46.5%; left: 32%; width: 45%; }
        .f-teacher { top: 51.5%; left: 32%; width: 45%; }

        /* خانات الأعداد والنتائج */
        .f-part-students { top: 56.5%; left: 45%; width: 25%; text-align: center; }
        .f-winners { top: 56.5%; left: 15%; width: 18%; text-align: center; }

        .f-passed-students { top: 61.5%; left: 45%; width: 25%; text-align: center; }
        .f-prizes { top: 61.5%; left: 15%; width: 18%; text-align: center; }

        .f-parents-disab { top: 66.5%; left: 45%; width: 25%; text-align: center; }
        .f-disab-students { top: 66.5%; left: 15%; width: 18%; text-align: center; }

        .f-partnerships-count { top: 71.5%; left: 45%; width: 25%; text-align: center; }
        .f-partnerships-names { top: 71.5%; left: 15%; width: 18%; text-align: center; }

        .f-results { top: 76.5%; left: 15%; width: 55%; }
        .f-notes { top: 83.0%; left: 15%; width: 55%; }

        /* التوقيعات السفلية */
        .f-sig-teacher-name { top: 90.0%; left: 68%; width: 22%; }
        .f-sig-teacher-date { top: 93.0%; left: 68%; width: 22%; font-size: 11px; }

        .f-sig-leader-name { top: 90.0%; left: 18%; width: 22%; }
        .f-sig-leader-date { top: 93.0%; left: 18%; width: 22%; font-size: 11px; }

        .print-btn-bar {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-print {
            background: #0C6A64;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-print:hover { background: #08504c; }

        @media print {
            body { background: none; padding: 0; }
            .print-btn-bar { display: none; }
            .print-container { box-shadow: none; width: 100%; height: 100vh; }
        }
    </style>
</head>
<body>

    <div class="print-btn-bar">
        <button class="btn-print" onclick="window.print()">🖨️ طباعة النموذج المباشر فوق الصورة الرسمية</button>
    </div>

    <div class="print-container">
        <!-- الصورة الأصلية المرفقة كخلفية رسمية للبطاقة -->
        <img src="image_e80be1.png" class="form-background-image" alt="النموذج الرسمي">

        <!-- حقول الإدخال المطابقة تماماً لمواقع الفراغات في الصورة -->
        <div class="overlay-fields-layer">
            <input type="text" class="editable-field f-school" value="مدرسة مكة المكرمة الابتدائية">
            <input type="text" class="editable-field f-competition" value="مسابقة القرآن الكريم والسنة النبوية">
            <input type="text" class="editable-field f-field" value="المواطنة والحياة / المسابقات">
            <input type="text" class="editable-field f-prep-classes" value="4 حصص">
            <input type="text" class="editable-field f-term" value="الفصل الدراسي الأول">
            
            <!-- بداية التنفيذ -->
            <input type="text" class="editable-field f-start-day" value="الثلاثاء">
            <input type="text" class="editable-field f-start-week" value="الثامن">
            <input type="text" class="editable-field f-start-date" value="1448/05/09 هـ">

            <!-- نهاية التنفيذ -->
            <input type="text" class="editable-field f-end-day" value="الخميس">
            <input type="text" class="editable-field f-end-week" value="الثامن">
            <input type="text" class="editable-field f-end-date" value="1448/05/11 هـ">

            <input type="text" class="editable-field f-class" value="جميع صفوف المرحلة الابتدائية">
            <input type="text" class="editable-field f-teacher" value="عصام الحازمي">

            <!-- الإحصائيات -->
            <input type="text" class="editable-field f-part-students" value="45">
            <input type="text" class="editable-field f-winners" value="10">

            <input type="text" class="editable-field f-passed-students" value="15">
            <input type="text" class="editable-field f-prizes" value="10 جوائز عينية">

            <input type="text" class="editable-field f-parents-disab" value="5 أولياء أمور">
            <input type="text" class="editable-field f-disab-students" value="طالبان (2)">

            <input type="text" class="editable-field f-partnerships-count" value="شراكة واحدة">
            <input type="text" class="editable-field f-partnerships-names" value="لجنة التنمية الاجتماعية">

            <input type="text" class="editable-field f-results" value="تأهل الطلاب للمرحلة النهائية وحفظ أجزاء من القرآن">
            <input type="text" class="editable-field f-notes" value="تم التنفيذ بنجاح وتفاعل مميز من الطلاب وأولياء الأمور">

            <!-- التوقيعات -->
            <input type="text" class="editable-field f-sig-teacher-name" value="عصام الحازمي">
            <input type="text" class="editable-field f-sig-teacher-date" value="09 / 05 / 1448">

            <input type="text" class="editable-field f-sig-leader-name" value="عواد محمد العوفي">
            <input type="text" class="editable-field f-sig-leader-date" value="09 / 05 / 1448">
        </div>
    </div>

</body>
</html>
